services:
  - type: web
    name: palpay-rail-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build:server
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PAYPAL_ENVIRONMENT
        value: SANDBOX
      # All of the below must be set manually in the Render dashboard to the
      # same values as server/.env — see README.md "Deploy the API" section.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_SANDBOX_CARD_NUMBER
        sync: false
      - key: PAYPAL_SANDBOX_CARD_EXPIRY
        sync: false
      - key: PAYPAL_SANDBOX_CARD_CVV
        sync: false
      - key: PAYPAL_SANDBOX_CARD_NAME
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: AGENT_API_KEY
        sync: false
      - key: MANAGER_API_KEY
        sync: false
